name: Prepare publish
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Path of the markdown file, e.g. membership.md"
        required: true

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      FILE: ${{ inputs.file }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Gather review commits for this file
        id: log
        run: |
          SLUG="${FILE//\//__}"
          SHA=$(git rev-parse --short=7 origin/reviews)
          if git rev-parse -q --verify "refs/tags/baseline/$SLUG" >/dev/null; then
            BASE="baseline/$SLUG"
          else
            BASE=$(git merge-base origin/main origin/reviews)
          fi
          git log --reverse --format='- %s (%an, %as)%n%b' "$BASE..origin/reviews" -- "$FILE" > log.txt
          [ -s log.txt ] || { echo "No review commits for $FILE"; exit 1; }
          {
            echo "slug=$SLUG"; echo "sha=$SHA"
            echo "prompt<<EOF"
            echo "Summarise these commits to ONE policy document as a git commit message: a short subject line (max 70 chars), a blank line, then 3-6 bullet points of the substantive changes. Plain text, no preamble."
            echo; cat log.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Draft summary with GitHub Models
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1-mini
          prompt: ${{ steps.log.outputs.prompt }}

      - name: Create branch and PR
        env:
          SLUG: ${{ steps.log.outputs.slug }}
          SHA: ${{ steps.log.outputs.sha }}
          SUMMARY: ${{ steps.ai.outputs.response }}
        run: |
          BR="publish/$SLUG--$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR" origin/main
          git checkout "$SHA" -- "$FILE" 2>/dev/null || git checkout origin/reviews -- "$FILE"
          git commit -m "Publish reviewed version of $FILE"
          git push origin "$BR"
          TITLE=$(printf '%s\n' "$SUMMARY" | head -n1)
          BODY=$(printf '%s\n' "$SUMMARY" | tail -n +3)
          gh pr create --base main --head "$BR" --title "$TITLE" --body "$BODY"
