name: Prepare publish
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Filename of the policy document, e.g. membership.md"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      FILE: ${{ inputs.file }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Gather review commits for this file
        id: log
        run: |
          SLUG="${FILE//\//__}"
          SHA=$(git rev-parse --short=7 origin/reviews)
          if git rev-parse -q --verify "refs/tags/baseline/$SLUG" >/dev/null; then
            BASE="baseline/$SLUG"
          else
            BASE=$(git merge-base origin/main origin/reviews)
          fi
          git log --reverse --format='- %s (%an, %as)%n%b' "$BASE..origin/reviews" -- "$FILE" > log.txt
          [ -s log.txt ] || { echo "No review commits for $FILE"; exit 1; }
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create branch and PR
        env:
          SLUG: ${{ steps.log.outputs.slug }}
          SHA: ${{ steps.log.outputs.sha }}
        run: |
          BR="publish/$SLUG--$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR" origin/main
          git checkout "$SHA" -- "$FILE"
          git commit -m "Publish reviewed version of $FILE"
          git push origin "$BR"
          { echo "Changes reviewed since the last publish:"; echo; cat log.txt; } > body.md
          gh pr create --base main --head "$BR" \
            --title "Publish reviewed changes to $FILE" \
            --body-file body.md
